# Microservicio de negocio; solo debe ser accesible desde cine-backend y servicios internos.
server.port=${SERVER_PORT:8081}

# Base local para pruebas. AWS RDS se activa con --spring.profiles.active=aws.
spring.datasource.url=${CINE_DB_URL:jdbc:h2:mem:cinedb}
spring.datasource.driver-class-name=${CINE_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${CINE_DB_USERNAME:sa}
spring.datasource.password=${CINE_DB_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:cineapp}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:cinepass-local}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.rabbitmq.exchanges.direct=cine.direct
app.rabbitmq.exchanges.topic=cine.topic
app.rabbitmq.queues.notifications=cine.notificaciones.queue
app.rabbitmq.queues.tickets=cine.tickets.queue
app.rabbitmq.queues.audit=cine.auditoria.queue
app.rabbitmq.dlq.notifications=cine.notificaciones.dlq
app.rabbitmq.dlq.tickets=cine.tickets.dlq
app.rabbitmq.dlq.audit=cine.auditoria.dlq
app.rabbitmq.routing.reserva-created=reserva.creada
app.rabbitmq.routing.reserva-cancelled=reserva.cancelada
app.rabbitmq.routing.ticket-created=ticket.generar
app.rabbitmq.routing.audit-pattern=reserva.*
