# cine-core corre en el puerto 8081 (el BFF, cine-backend, sigue en el 8080).
server.port=8081

# ==========================================================
# CONFIGURACION ACTIVA: H2 (base de datos en memoria)
# ==========================================================
spring.datasource.url=jdbc:h2:mem:cinedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sin esto, Spring corre data.sql ANTES de que Hibernate cree las tablas,
# y la insercion falla con "Table not found".
spring.jpa.defer-datasource-initialization=true

