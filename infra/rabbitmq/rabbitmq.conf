# Peer discovery por lista de nodos. Ambos nodos comparten este archivo y Erlang cookie.
# Sus hostnames los define docker-compose: rabbitmq1 y rabbitmq2.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.target_cluster_size_hint = 2

# No habilitar usuario guest remoto. Usar el usuario creado por docker-compose.
