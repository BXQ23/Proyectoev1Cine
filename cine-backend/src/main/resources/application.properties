# API pública/BFF. APP_AUTH_MODE=dev SOLO para pruebas locales; en despliegue usar firebase.
server.port=${SERVER_PORT:8080}
app.auth.mode=${APP_AUTH_MODE:firebase}

# URL privada de cine-core. En AWS, configurarla con DNS privado o IP privada; no exponer cine-core.
core.service.url=${CORE_SERVICE_URL:http://localhost:8081}

# Vite local usa el puerto 3000; agregar aquí el dominio de producción si cambia.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

# Credenciales privadas de Firebase Admin, fuera del repositorio.
# Se usa únicamente con APP_AUTH_MODE=firebase.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# RabbitMQ (local por Docker Compose; en AWS apuntar a nodo/endpoint privado).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:cineapp}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:cinepass-local}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Topología centralizada. Todas las apps usan los mismos nombres.
app.rabbitmq.exchanges.direct=cine.direct
app.rabbitmq.exchanges.topic=cine.topic
app.rabbitmq.queues.notifications=cine.notificaciones.queue
app.rabbitmq.queues.tickets=cine.tickets.queue
app.rabbitmq.queues.audit=cine.auditoria.queue
app.rabbitmq.dlq.notifications=cine.notificaciones.dlq
app.rabbitmq.dlq.tickets=cine.tickets.dlq
app.rabbitmq.dlq.audit=cine.auditoria.dlq
app.rabbitmq.routing.reserva-created=reserva.creada
app.rabbitmq.routing.reserva-cancelled=reserva.cancelada
app.rabbitmq.routing.ticket-created=ticket.generar
app.rabbitmq.routing.audit-pattern=reserva.*
