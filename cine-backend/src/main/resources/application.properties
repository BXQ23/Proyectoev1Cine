# ==========================================================
# CORE (microservicio de negocio): el BFF NO tiene base de datos propia,
# reenvia todo hacia cine-core, que corre en el puerto 8081.
# ==========================================================
core.service.url=http://localhost:8081

# ==========================================================
# CORS: por ahora dejamos pasar al frontend en localhost:3000 (React) y 4200 (Angular)
# durante el desarrollo. Mas adelante esto se ajusta cuando entre el API Gateway.
# ==========================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

